name: competitive-landscape
version: "1.0.0"
description: >
  Schema for tracking competitors, market landscape, and strategic analysis
  for Diane as a personal AI agent. Covers competitor projects, positioning,
  feature comparison, and strategic initiatives. Links to Agent, Project,
  Scenario, and other existing domain types for full traceability.
author: Emergent
license: MIT

# ─────────────────────────────────────────────────────────────────────────────
# OBJECT TYPES
# ─────────────────────────────────────────────────────────────────────────────

objectTypes:

  # ── Competitor ────────────────────────────────────────────────────────────

  - name: Competitor
    label: Competitor
    description: >
      A project, product, or platform that competes with Diane as a personal
      AI agent. Can be open-source, commercial, or internal.
      Represents the highest-level entity for competitive tracking.
    properties:
      name:
        type: string
        description: "Project/product name. E.g. 'Hermes', 'ChatGPT Personal'"
      description:
        type: string
        description: "What this competitor does"
      status:
        type: string
        description: "Current status: active, alpha, beta, mature, deprecated, unknown"
      category:
        type: string
        description: "Competitor category: personal-agent, enterprise-agent, chat-ui, mcp-server, full-stack"
      maturity:
        type: string
        description: "Market maturity: experimental, growing, established, dominant"
      is_open_source:
        type: boolean
        description: "Whether the project is open source"
      license:
        type: string
        description: "License type if open source. E.g. MIT, Apache-2.0, AGPL"
      repo_url:
        type: string
        description: "GitHub/repository URL"
      website_url:
        type: string
        description: "Project website URL"
      launch_date:
        type: string
        description: "ISO 8601 date when the project was launched (approximate)"
      target_audience:
        type: array
        items: string
        description: "Target users. E.g. [developers, enterprises, consumers]"
      tech_stack:
        type: array
        items: string
        description: "Key technologies. E.g. [Go, TypeScript, SwiftUI, React]"
      notes:
        type: string
        description: "Additional notes about this competitor"

  # ── Competitor Feature ────────────────────────────────────────────────────

  - name: CompetitorFeature
    label: Competitor Feature
    description: >
      A specific feature or capability of a competitor project.
      Used for granular feature-by-feature comparison.
    properties:
      name:
        type: string
        description: "Feature name. E.g. 'MCP Proxy', 'Agent Runner', 'Knowledge Graph', 'Chat UI'"
      description:
        type: string
        description: "What this feature does"
      capability_area:
        type: string
        description: "Area: agent-runner, mcp-proxy, chat-ui, memory, skills, tool-guard, notification, scheduling"
      is_core:
        type: boolean
        description: "Whether this is a core/differentiating feature vs. nice-to-have"
      maturity_level:
        type: string
        description: "How mature this feature is: experimental, beta, production, deprecated"

  # ── Comparison Point ──────────────────────────────────────────────────────

  - name: ComparisonPoint
    label: Comparison Point
    description: >
      A direct comparison between Diane and a specific competitor on a
      specific feature or capability. Captures the assessment of relative
      strength and the reasoning.
    properties:
      assessment:
        type: string
        description: "Diane's relative strength: stronger, equal, weaker, missing"
      reasoning:
        type: string
        description: "Why this assessment. E.g. 'Diane has 69+ tools, Hermes has 12'"
      evidence:
        type: string
        description: "Concrete evidence or data point supporting the assessment"
      priority:
        type: string
        description: "How critical this gap is: critical, high, medium, low, informational"

  # ── Strategic Initiative ──────────────────────────────────────────────────

  - name: StrategicInitiative
    label: Strategic Initiative
    description: >
      A strategic response to competitive pressure — a feature, product area,
      or pivot that Diane should pursue to maintain or gain advantage.
    properties:
      title:
        type: string
        description: "Initiative title"
      description:
        type: string
        description: "What needs to be done and why"
      competitive_driver:
        type: string
        description: "Which competitor or market trend is driving this initiative"
      status:
        type: string
        description: "Current status: proposed, planned, in_progress, completed, cancelled"
      priority:
        type: string
        description: "Priority: critical, high, medium, low"
      target_date:
        type: string
        description: "ISO 8601 target completion date"
      owner:
        type: string
        description: "Who is responsible"

  # ── Market Trend ──────────────────────────────────────────────────────────

  - name: MarketTrend
    label: Market Trend
    description: >
      A broader industry movement or trend that affects the personal AI
      agent space. Used to contextualize competitive moves and opportunities.
    properties:
      name:
        type: string
        description: "Trend name. E.g. 'MCP Standardization', 'Agent-to-Agent Protocols'"
      description:
        type: string
        description: "What this trend is about"
      impact_on_diane:
        type: string
        description: "How this trend affects Diane positively or negatively"
      impact_level:
        type: string
        description: "Impact: positive, negative, neutral"
      source:
        type: string
        description: "Source URL or reference where this trend was observed"
      observed_date:
        type: string
        description: "ISO 8601 date when the trend was noted"

  # ── Capability Matrix ─────────────────────────────────────────────────────

  - name: CapabilityMatrix
    label: Capability Matrix
    description: >
      A structured comparison of multiple competitors across a set of
      features or capabilities. Aggregates individual ComparisonPoints.
    properties:
      title:
        type: string
        description: "Title of the matrix. E.g. 'Feature Comparison Q1 2025'"
      analysis_date:
        type: string
        description: "ISO 8601 date when the analysis was performed"
      competitors_analyzed:
        type: array
        items: string
        description: "List of competitor names included in this matrix"
      summary:
        type: string
        description: "Key takeaways from the comparison"

  # ── Feature Gap ───────────────────────────────────────────────────────────

  - name: FeatureGap
    label: Feature Gap
    description: >
      A feature that Diane lacks but one or more competitors have.
      Represents a potential area for development.
    properties:
      gap_name:
        type: string
        description: "Short name for this gap. E.g. 'iOS App', 'Voice Input'"
      description:
        type: string
        description: "What's missing and why it matters"
      competitors_have_it:
        type: array
        items: string
        description: "Which competitors offer this feature"
      impact:
        type: string
        description: "Business impact: critical, high, medium, low"
      effort_to_add:
        type: string
        description: "Estimated effort: low, medium, high, massive"
      is_being_worked_on:
        type: boolean
        description: "Whether there's active work to close this gap"

  # ── Pricing Model ─────────────────────────────────────────────────────────

  - name: PricingModel
    label: Pricing Model
    description: >
      A pricing strategy used by a competitor. Useful for positioning
      and monetization analysis.
    properties:
      model_type:
        type: string
        description: "Type: free, freemium, subscription, usage-based, enterprise"
      price_range:
        type: string
        description: "Price range. E.g. '$0-$20/mo', 'Contact sales'"
      currency:
        type: string
        description: "Currency. E.g. USD, EUR"
      notes:
        type: string
        description: "Additional pricing details"

  # ── Integration ───────────────────────────────────────────────────────────

  - name: Integration
    label: Integration
    description: >
      A third-party integration or platform support offered by a competitor.
    properties:
      name:
        type: string
        description: "Integration name. E.g. 'Slack', 'GitHub', 'Jira'"
      integration_type:
        type: string
        description: "Type: messaging, coding, calendar, email, browser, file-storage"
      maturity_level:
        type: string
        description: "How mature: experimental, beta, production"
      notes:
        type: string
        description: "Additional details about the integration"

  # ── Scenario (cross-pack reference stub) ─────────────────────────────────

  - name: Scenario
    label: Scenario
    description: >
      Cross-pack reference to a Scenario object from the code-structure pack.
      Used as a target for the `drives` relationship from StrategicInitiative.
    properties:
      name:
        type: string
        description: "Scenario name"

# ─────────────────────────────────────────────────────────────────────────────
# RELATIONSHIP TYPES
# ─────────────────────────────────────────────────────────────────────────────

relationshipTypes:

  # ── Competitor → Feature ─────────────────────────────────────────────────

  - name: has_feature
    label: Has Feature
    description: Competitor offers this feature
    sourceType: Competitor
    targetType: CompetitorFeature

  # ── Competitor → Comparison ──────────────────────────────────────────────

  - name: compares_on
    label: Compares On
    description: This comparison point evaluates Diane vs this competitor
    sourceType: Competitor
    targetType: ComparisonPoint

  - name: evaluated_by
    label: Evaluated By
    description: This comparison point is about this feature
    sourceType: ComparisonPoint
    targetType: CompetitorFeature

  # ── Competitor → Pricing ─────────────────────────────────────────────────

  - name: uses_pricing
    label: Uses Pricing
    description: Competitor uses this pricing model
    sourceType: Competitor
    targetType: PricingModel

  # ── Competitor → Integration ─────────────────────────────────────────────

  - name: provides_integration
    label: Provides Integration
    description: Competitor supports this integration
    sourceType: Competitor
    targetType: Integration

  # ── Competitor → Feature Gap ─────────────────────────────────────────────

  - name: exposes_gap
    label: Exposes Gap
    description: This competitor has a feature Diane lacks
    sourceType: Competitor
    targetType: FeatureGap

  # ── Strategic Initiative ─────────────────────────────────────────────────

  - name: responds_to
    label: Responds To
    description: This initiative is a response to competitive pressure from this competitor
    sourceType: StrategicInitiative
    targetType: Competitor

  - name: closes_gap
    label: Closes Gap
    description: This initiative addresses this feature gap
    sourceType: StrategicInitiative
    targetType: FeatureGap

  - name: captures_trend
    label: Captures Trend
    description: This initiative leverages this market trend
    sourceType: StrategicInitiative
    targetType: MarketTrend

  # ── Market Trend ─────────────────────────────────────────────────────────

  - name: impacts
    label: Impacts
    description: This trend affects this competitor
    sourceType: MarketTrend
    targetType: Competitor

  # ── Comparison Point → Competitor ────────────────────────────────────────

  - name: compares_against
    label: Compares Against
    description: The other competitor in this comparison
    sourceType: ComparisonPoint
    targetType: Competitor

  # ── Capability Matrix ────────────────────────────────────────────────────

  - name: includes
    label: Includes
    description: This matrix covers this comparison point
    sourceType: CapabilityMatrix
    targetType: ComparisonPoint

  # ── Cross-pack: Competitive → Code Structure ──────────────────────────────

  - name: drives
    label: Drives
    description: This strategic initiative drives the implementation of a scenario in the codebase
    sourceType: StrategicInitiative
    targetType: Scenario
