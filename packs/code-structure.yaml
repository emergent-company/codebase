name: code-structure
version: 1.0.0
description: >
  General-purpose structural schema for mapping any software project.
  Covers the architectural layer: apps, modules, pages, components, services,
  data models, persistence, APIs, events, middleware, jobs, and supporting
  concerns like config, patterns, and tests.

objectTypes:

  - name: App
    label: Application
    description: >
      A deployable application unit — frontend, backend, mobile, desktop, CLI, or library.
      Top-level container in the project hierarchy.
    properties:
      app_type:
        type: string
        description: "Kind of application. E.g. frontend, backend, mobile, desktop, cli, library"
      platform:
        type: array
        items: string
        description: "Target platforms. E.g. [web], [ios, android], [macos, linux]"
      root_path:
        type: string
        description: "Root directory relative to the repo. E.g. apps/web, services/auth"
      tech_stack:
        type: array
        items: string
        description: "Key technologies. E.g. [react, typescript, vite]"
      deployment_target:
        type: string
        description: "Where it deploys. E.g. vercel, kubernetes, app-store"
      port:
        type: number
        description: "Default local development port"
      description:
        type: string

  - name: Module
    label: Module
    description: >
      A sub-package or module within an app — Go package, npm package, Python module,
      feature folder, or any named unit of code organization below the app level.
    properties:
      path:
        type: string
        description: "Path relative to app root. E.g. internal/auth, src/features/billing"
      language:
        type: string
        description: "Primary language. E.g. go, typescript, python, swift"
      purpose:
        type: string
        description: "What this module does"
      description:
        type: string

  - name: SourceFile
    label: Source File
    description: A tracked source file within a module.
    properties:
      path:
        type: string
        description: "File path relative to repo root"
      language:
        type: string
        description: "Programming language. E.g. go, typescript, python"
      purpose:
        type: string
        description: "What this file contains or does"
      description:
        type: string

  - name: Context
    label: Context
    description: >
      A screen, modal, panel, or interaction surface in the application —
      a React page, Next.js route, SwiftUI View, modal dialog, drawer, bottom sheet,
      or any named surface where a user interacts. Contexts use UIComponents and
      make Actions available. Scenarios occur within Contexts.
    properties:
      context_type:
        type: string
        description: >
          The medium or interaction paradigm this context lives in.
          E.g. web-view, mobile-screen, desktop-window, cli, notification,
          widget, poster, overlay, email, watch-face
      type:
        type: string
        description: "Kind of surface within the medium. E.g. screen, modal, panel, drawer, bottom-sheet, toast"
      scope:
        type: string
        description: "Visibility scope. E.g. internal, external"
      route:
        type: string
        description: "URL route or navigation path if applicable. E.g. /dashboard, /users/:id"
      platform:
        type: array
        items: string
        description: "Target platforms. E.g. [ios], [android], [web]"
      description:
        type: string

  - name: Wireframe
    label: Wireframe
    description: >
      An ASCII box-layout wireframe for a Context — captures the spatial
      arrangement of UIComponents on a screen, modal, or panel.
      Use [ComponentName] notation to reference UIComponents by name.
      One context may have multiple wireframes (e.g. per platform, viewport, or UI state).
    properties:
      ascii:
        type: string
        description: "ASCII box layout. Use [ComponentName] to reference UIComponents. E.g. +--[Sidebar: NavMenu]--+--[Main]--+"
      platform:
        type: string
        description: "Platform variant this wireframe depicts. E.g. web, mobile, desktop, tablet"
      viewport:
        type: string
        description: "Viewport size or breakpoint. E.g. 375x812, 1440x900, sm, lg"
      state:
        type: string
        description: "UI state depicted. E.g. default, empty, loading, error, success"
      notes:
        type: string
        description: "Design annotations or constraints not expressible in ASCII"
      description:
        type: string

  - name: UIComponent
    label: UI Component
    description: >
      A reusable UI component — React component, SwiftUI View, widget, form field,
      layout primitive, or any named, self-contained piece of UI. Can be composed
      from other UIComponents. Used by Contexts.
    properties:
      type:
        type: string
        description: "Component category. E.g. primitive, composite, layout, container"
      description:
        type: string

  - name: Action
    label: Action
    description: >
      A user action or system operation — navigation, data mutation, toggle,
      form submission, external call. Actions are available within Contexts
      and performed during Scenario steps.
    properties:
      type:
        type: string
        description: "Action category. E.g. navigation, mutation, trigger, toggle, external"
      display_label:
        type: string
        description: "Human-readable label shown in the UI. E.g. Save Changes, Delete User"
      description:
        type: string

  - name: Actor
    label: Actor
    description: >
      A user role, persona, or system actor that executes scenarios —
      guest, member, admin, anonymous user, external system, etc.
    properties:
      display_name:
        type: string
        description: "Human-readable name. E.g. Guest User, Admin"
      description:
        type: string

  - name: Scenario
    label: Scenario
    description: >
      A concrete, testable example of behavior — a user story expressed as
      given/when/then. Scenarios occur within Contexts, are executed by Actors,
      and can be broken into ScenarioSteps for complex flows.
    properties:
      title:
        type: string
        description: "Human-readable title. E.g. Valid Credentials Login"
      given:
        type: string
        description: "Precondition. E.g. a user with valid credentials"
      when:
        type: string
        description: "Triggering action. E.g. the user submits the login form"
      then:
        type: string
        description: "Expected outcome. E.g. a JWT token is returned"
      and_also:
        type: array
        items: string
        description: "Additional outcomes. E.g. [user is redirected to dashboard]"
      description:
        type: string

  - name: ScenarioStep
    label: Scenario Step
    description: >
      An ordered step within a complex scenario. Optional — simple scenarios
      may use just given/when/then. Steps pin to a specific Context and Action.
    properties:
      sequence:
        type: number
        description: "Step order — 1, 2, 3, ..."
      description:
        type: string

  - name: Service
    label: Service
    description: >
      A business logic service — UserService, AuthService, PaymentService, etc.
      Encapsulates domain operations and orchestrates data access.
    properties:
      description:
        type: string

  - name: DataModel
    label: Data Model
    description: >
      A domain data type, schema definition, or data transfer object shared
      across the system — Go struct, TypeScript interface, Pydantic model,
      database table schema, Protobuf message, etc.
    properties:
      language_type:
        type: string
        description: "Language-specific type name if different from the object name"
      fields:
        type: array
        items: string
        description: "Key field names"
      persistence:
        type: string
        description: "How instances are stored. E.g. sqlite, postgres, memory, none"
      description:
        type: string

  - name: Database
    label: Database / Store
    description: >
      A persistence or state store — Postgres, MySQL, Redis, SQLite, S3,
      Zustand store, Pinia store, Redux slice, etc.
    properties:
      kind:
        type: string
        description: "Type of store. E.g. relational, key-value, document, object-storage, client-state"
      technology:
        type: string
        description: "Specific technology. E.g. postgres, redis, sqlite, zustand"
      host:
        type: string
        description: "Hostname or connection hint for non-local stores"
      description:
        type: string

  - name: APIEndpoint
    label: API Endpoint
    description: A single HTTP, gRPC, GraphQL, or WebSocket endpoint.
    properties:
      method:
        type: string
        description: "HTTP method or RPC type. E.g. GET, POST, PUT, DELETE, rpc"
      path:
        type: string
        description: "URL path or RPC method name. E.g. /api/v1/users, GetUser"
      auth_required:
        type: boolean
        description: "Whether authentication is required"
      description:
        type: string

  - name: APIContract
    label: API Contract
    description: >
      A machine-readable API definition grouping multiple endpoints —
      OpenAPI/Swagger file, Protobuf file, GraphQL schema, etc.
    properties:
      format:
        type: string
        description: "Specification format. E.g. openapi, protobuf, graphql"
      version:
        type: string
        description: "API version. E.g. v1, v2"
      file_path:
        type: string
        description: "Path to the spec file"
      base_url:
        type: string
        description: "Base URL for the API"
      description:
        type: string

  - name: Event
    label: Event / Message
    description: >
      A pub/sub event, message queue message type, WebSocket event name,
      or domain event — anything asynchronously published and consumed.
    properties:
      channel:
        type: string
        description: "Queue name, topic, or event channel. E.g. user.created, orders-queue"
      transport:
        type: string
        description: "Transport mechanism. E.g. kafka, rabbitmq, websocket, sns, in-process"
      description:
        type: string

  - name: Middleware
    label: Middleware
    description: >
      A request pipeline handler — auth middleware, logging, rate limiting,
      CORS, tracing, error handling, etc.
    properties:
      kind:
        type: string
        description: "Category. E.g. auth, logging, rate-limiting, cors, tracing, error-handling"
      applies_to:
        type: string
        description: "Scope of application. E.g. all routes, /api/*, admin only"
      description:
        type: string

  - name: Job
    label: Job / Worker
    description: >
      A background job, cron task, or queue worker — email sender,
      report generator, data sync worker, scheduled cleanup, etc.
    properties:
      kind:
        type: string
        description: "Category. E.g. cron, queue-worker, one-off, scheduled"
      schedule:
        type: string
        description: "Cron expression or interval for scheduled jobs. E.g. 0 * * * *"
      description:
        type: string

  - name: ExternalDependency
    label: External Dependency
    description: >
      A third-party library, SDK, or external service the project depends on —
      npm package, Go module, Python package, SaaS API, etc.
    properties:
      kind:
        type: string
        description: "Category. E.g. library, sdk, saas-api, infrastructure"
      version:
        type: string
        description: "Version or version constraint. E.g. ^18.0.0, v1.21"
      registry:
        type: string
        description: "Package registry. E.g. npm, go-modules, pypi, cargo"
      repo_url:
        type: string
        description: "URL to the source repository. Used for tracking releases, changelogs, and updates. E.g. https://github.com/robfig/cron"
      description:
        type: string

  - name: ConfigVar
    label: Config Variable
    description: >
      An environment variable, feature flag, or configuration key the app
      reads at runtime — secrets, URLs, toggles, tuning parameters, etc.
    properties:
      key:
        type: string
        description: "The variable name. E.g. DATABASE_URL, STRIPE_SECRET_KEY"
      required:
        type: boolean
        description: "Whether the app fails to start without this value"
      default_value:
        type: string
        description: "Default value if not set"
      secret:
        type: boolean
        description: "Whether this holds a secret and should not be logged"
      description:
        type: string

  - name: Pattern
    label: Pattern
    description: >
      A recurring implementation pattern observed or mandated in the codebase —
      repository pattern, command pattern, optimistic UI update, retry with backoff, etc.
    properties:
      kind:
        type: string
        description: "Category. E.g. architectural, ui, data-access, error-handling, concurrency"
      scope:
        type: string
        description: "Where this pattern applies. E.g. backend, frontend, data-layer, global"
      example_path:
        type: string
        description: "Path to a canonical example file"
      usage_guidance:
        type: string
        description: "When and how to apply this pattern"
      description:
        type: string

  - name: TestSuite
    label: Test Suite
    description: >
      A test file, test group, or spec file covering a component, service,
      module, or page — unit tests, integration tests, e2e specs, etc.
    properties:
      kind:
        type: string
        description: "Test category. E.g. unit, integration, e2e, snapshot"
      framework:
        type: string
        description: "Test framework. E.g. jest, vitest, go-test, pytest, xctest"
      coverage_percent:
        type: number
        description: "Approximate code coverage percentage"
      description:
        type: string

relationshipTypes:

  # ── App-level structure ──────────────────────────────────────────────────────

  - name: depends_on_app
    label: Depends On App
    description: Runtime or build-time dependency between two apps
    sourceType: App
    targetType: App

  - name: contains_module
    label: Contains Module
    description: An app is composed of one or more modules
    sourceType: App
    targetType: Module

  - name: app_uses_dependency
    label: App Uses Dependency
    description: An app depends on an external library or service
    sourceType: App
    targetType: ExternalDependency

  - name: module_uses_dependency
    label: Module Uses Dependency
    description: A module depends on an external library or service
    sourceType: Module
    targetType: ExternalDependency

  - name: app_configured_by
    label: App Configured By
    description: An app reads a config variable at runtime
    sourceType: App
    targetType: ConfigVar

  - name: module_configured_by
    label: Module Configured By
    description: A module reads a config variable at runtime
    sourceType: Module
    targetType: ConfigVar

  - name: service_configured_by
    label: Service Configured By
    description: A service reads a config variable at runtime
    sourceType: Service
    targetType: ConfigVar

  - name: app_uses_middleware
    label: App Uses Middleware
    description: An app applies middleware to its request pipeline
    sourceType: App
    targetType: Middleware

  - name: module_uses_middleware
    label: Module Uses Middleware
    description: A module applies middleware to its request pipeline
    sourceType: Module
    targetType: Middleware

  # ── Module-level structure ───────────────────────────────────────────────────

  - name: contains_file
    label: Contains File
    description: A module owns a source file
    sourceType: Module
    targetType: SourceFile

  - name: defines_context
    label: Defines Context
    description: A source file implements a screen, modal, or interaction surface
    sourceType: SourceFile
    targetType: Context

  - name: defines_component
    label: Defines Component
    description: A source file implements a UI component
    sourceType: SourceFile
    targetType: UIComponent

  - name: defines_service
    label: Defines Service
    description: A source file implements a service
    sourceType: SourceFile
    targetType: Service

  - name: defines_model
    label: Defines Model
    description: A source file declares a data model
    sourceType: SourceFile
    targetType: DataModel

  - name: defines_action
    label: Defines Action
    description: A source file implements a user action or handler
    sourceType: SourceFile
    targetType: Action

  - name: defines_middleware
    label: Defines Middleware
    description: A source file implements a middleware handler
    sourceType: SourceFile
    targetType: Middleware

  - name: defines_job
    label: Defines Job
    description: A source file implements a background job or worker
    sourceType: SourceFile
    targetType: Job

  - name: defines_test_suite
    label: Defines Test Suite
    description: A source file is the test file for a test suite
    sourceType: SourceFile
    targetType: TestSuite

  - name: defines_interface
    label: Defines Interface
    description: A source file declares the interface or contract for a service
    sourceType: SourceFile
    targetType: Service

  - name: entry_point_of
    label: Entry Point Of
    description: A source file is the main entry point for an app
    sourceType: SourceFile
    targetType: App

  - name: contains_context
    label: Contains Context
    description: A module defines a screen, modal, or interaction surface
    sourceType: Module
    targetType: Context

  - name: contains_component
    label: Contains Component
    description: A module defines a reusable UI component
    sourceType: Module
    targetType: UIComponent

  - name: contains_action
    label: Contains Action
    description: A module defines a user action or system operation
    sourceType: Module
    targetType: Action

  - name: contains_service
    label: Contains Service
    description: A module owns a service
    sourceType: Module
    targetType: Service

  - name: module_depends_on_module
    label: Module Depends On Module
    description: A module imports or depends on another module
    sourceType: Module
    targetType: Module

  - name: module_depends_on_service
    label: Module Depends On Service
    description: A module imports or depends on a service
    sourceType: Module
    targetType: Service

  - name: service_depends_on_module
    label: Service Depends On Module
    description: A service imports or depends on a module
    sourceType: Service
    targetType: Module

  - name: service_depends_on_service
    label: Service Depends On Service
    description: A service imports or depends on another service
    sourceType: Service
    targetType: Service

  - name: module_provides_model
    label: Module Provides Model
    description: A module owns and defines a data model
    sourceType: Module
    targetType: DataModel

  - name: service_provides_model
    label: Service Provides Model
    description: A service owns and defines a data model
    sourceType: Service
    targetType: DataModel

  - name: module_exposes_endpoint
    label: Module Exposes Endpoint
    description: A module exposes an API endpoint
    sourceType: Module
    targetType: APIEndpoint

  - name: service_exposes_endpoint
    label: Service Exposes Endpoint
    description: A service exposes an API endpoint
    sourceType: Service
    targetType: APIEndpoint

  - name: grouped_in
    label: Grouped In
    description: An endpoint belongs to an API contract
    sourceType: APIEndpoint
    targetType: APIContract

  # ── Context / UIComponent / Action layer ────────────────────────────────────

  - name: has_wireframe
    label: Has Wireframe
    description: >
      Links a Context to an ASCII wireframe. One context may have multiple
      wireframes for different platforms, viewports, or UI states.
      To find the parent Context of a wireframe: flow graph rels --reverse <wireframe-id>
    sourceType: Context
    targetType: Wireframe

  - name: uses_component
    label: Uses Component
    description: A context depends on a UI component to render part of its surface
    sourceType: Context
    targetType: UIComponent

  - name: nested_in
    label: Nested In
    description: A context is nested inside another context (e.g. modal inside screen, panel inside screen)
    sourceType: Context
    targetType: Context

  - name: composed_of
    label: Composed Of
    description: A UI component is built from other UI components
    sourceType: UIComponent
    targetType: UIComponent

  - name: available_in
    label: Available In
    description: An action is available within a context
    sourceType: Action
    targetType: Context

  - name: navigates_to
    label: Navigates To
    description: An action navigates to a target context
    sourceType: Action
    targetType: Context

  - name: context_uses_service
    label: Context Uses Service
    description: A context calls a frontend or backend service
    sourceType: Context
    targetType: Service

  - name: action_uses_service
    label: Action Uses Service
    description: An action calls a frontend or backend service
    sourceType: Action
    targetType: Service

  - name: component_uses_service
    label: Component Uses Service
    description: A UI component calls a frontend or backend service
    sourceType: UIComponent
    targetType: Service

  - name: context_calls_endpoint
    label: Context Calls Endpoint
    description: A context directly invokes an API endpoint (e.g. a screen that GETs its data on mount)
    sourceType: Context
    targetType: APIEndpoint

  - name: action_calls_endpoint
    label: Action Calls Endpoint
    description: An action directly invokes an API endpoint (e.g. a button action that POSTs to /api/users)
    sourceType: Action
    targetType: APIEndpoint

  - name: component_calls_endpoint
    label: Component Calls Endpoint
    description: A self-contained UI component directly invokes an API endpoint
    sourceType: UIComponent
    targetType: APIEndpoint

  - name: module_consumes_model
    label: Module Consumes Model
    description: A module uses a data model as a form payload, API response shape, or local state type
    sourceType: Module
    targetType: DataModel

  - name: service_consumes_model
    label: Service Consumes Model
    description: A service uses a data model as a form payload, API response shape, or local state type
    sourceType: Service
    targetType: DataModel

  - name: context_consumes_model
    label: Context Consumes Model
    description: A context uses a data model as a form payload, API response shape, or local state type
    sourceType: Context
    targetType: DataModel

  - name: action_consumes_model
    label: Action Consumes Model
    description: An action uses a data model as a form payload, API response shape, or local state type
    sourceType: Action
    targetType: DataModel

  - name: component_consumes_model
    label: Component Consumes Model
    description: A UI component uses a data model as a form payload, API response shape, or local state type
    sourceType: UIComponent
    targetType: DataModel

  # ── Scenario layer ───────────────────────────────────────────────────────────

  - name: executed_by
    label: Executed By
    description: A scenario is executed by an actor (user role or persona)
    sourceType: Scenario
    targetType: Actor

  - name: has_step
    label: Has Step
    description: A scenario contains an ordered step
    sourceType: Scenario
    targetType: ScenarioStep

  - name: variant_of
    label: Variant Of
    description: A scenario is an alternative path of another scenario
    sourceType: Scenario
    targetType: Scenario

  - name: occurs_in
    label: Occurs In
    description: A scenario step takes place within a specific context
    sourceType: ScenarioStep
    targetType: Context

  - name: performs
    label: Performs
    description: A scenario step performs a specific action
    sourceType: ScenarioStep
    targetType: Action

  - name: inherits_from
    label: Inherits From
    description: An actor inherits permissions and capabilities from another actor
    sourceType: Actor
    targetType: Actor

  # ── Service layer ────────────────────────────────────────────────────────────

  - name: calls_service
    label: Calls Service
    description: A service delegates to or orchestrates another service
    sourceType: Service
    targetType: Service

  - name: service_reads_from
    label: Service Reads From
    description: A service reads data from a database or store
    sourceType: Service
    targetType: Database

  - name: job_reads_from
    label: Job Reads From
    description: A job reads data from a database or store
    sourceType: Job
    targetType: Database

  - name: service_writes_to
    label: Service Writes To
    description: A service writes data to a database or store
    sourceType: Service
    targetType: Database

  - name: job_writes_to
    label: Job Writes To
    description: A job writes data to a database or store
    sourceType: Job
    targetType: Database

  - name: stores_model
    label: Stores Model
    description: A database or store persists a data model
    sourceType: Database
    targetType: DataModel

  # ── Events ───────────────────────────────────────────────────────────────────

  - name: service_publishes_event
    label: Service Publishes Event
    description: A service emits an event or message
    sourceType: Service
    targetType: Event

  - name: action_publishes_event
    label: Action Publishes Event
    description: An action emits an event or message
    sourceType: Action
    targetType: Event

  - name: job_publishes_event
    label: Job Publishes Event
    description: A job emits an event or message
    sourceType: Job
    targetType: Event

  - name: service_subscribes_to
    label: Service Subscribes To
    description: A service consumes an event or message
    sourceType: Service
    targetType: Event

  - name: action_subscribes_to
    label: Action Subscribes To
    description: An action consumes an event or message
    sourceType: Action
    targetType: Event

  - name: job_subscribes_to
    label: Job Subscribes To
    description: A job consumes an event or message
    sourceType: Job
    targetType: Event

  # ── Jobs ─────────────────────────────────────────────────────────────────────

  - name: service_triggers_job
    label: Service Triggers Job
    description: A service enqueues or schedules a background job
    sourceType: Service
    targetType: Job

  - name: action_triggers_job
    label: Action Triggers Job
    description: An action enqueues or schedules a background job
    sourceType: Action
    targetType: Job

  - name: job_triggers_job
    label: Job Triggers Job
    description: A job enqueues or schedules another background job
    sourceType: Job
    targetType: Job

  # ── Patterns & tests ─────────────────────────────────────────────────────────

  - name: module_uses_pattern
    label: Module Uses Pattern
    description: A module follows a named architectural pattern
    sourceType: Module
    targetType: Pattern

  - name: service_uses_pattern
    label: Service Uses Pattern
    description: A service follows a named architectural pattern
    sourceType: Service
    targetType: Pattern

  - name: context_uses_pattern
    label: Context Uses Pattern
    description: A context follows a named UI pattern
    sourceType: Context
    targetType: Pattern

  - name: component_uses_pattern
    label: Component Uses Pattern
    description: A UI component follows a named UI pattern
    sourceType: UIComponent
    targetType: Pattern

  - name: action_uses_pattern
    label: Action Uses Pattern
    description: An action follows a named pattern
    sourceType: Action
    targetType: Pattern

  - name: extends_pattern
    label: Extends Pattern
    description: One pattern builds upon or specializes another
    sourceType: Pattern
    targetType: Pattern

  - name: context_tested_by
    label: Context Tested By
    description: A context is covered by a test suite
    sourceType: Context
    targetType: TestSuite

  - name: component_tested_by
    label: Component Tested By
    description: A UI component is covered by a test suite
